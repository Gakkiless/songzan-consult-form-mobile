<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线下活动记录</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
  background:#F0F2F5;
  color:#333;
  font-size:13px;
}
.top-bar {
  height:48px;
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  padding:0 24px;
  display:flex;
  align-items:center;
  gap:16px;
  position:sticky;
  top:0;
  z-index:10;
}
.top-logo { font-size:15px; font-weight:600; color:#333; white-space:nowrap; }
.top-logo em { font-style:normal; color:#000; }
.top-spacer { flex:1; }
.btn {
  padding:5px 16px;
  font-size:13px;
  border:1px solid #d9d9d9;
  background:#fff;
  color:#333;
  cursor:pointer;
  border-radius:4px;
  font-family:inherit;
  transition:.2s;
}
.btn:hover { color:#000; border-color:#000; }
.btn-primary { background:#000; color:#fff; border-color:#000; }
.btn-primary:hover { background:#595959; border-color:#595959; color:#fff; }
.page-container {
  max-width:1280px;
  margin:0 auto;
  padding:16px 24px 28px;
}
.breadcrumb {
  font-size:12px;
  color:#999;
  margin-bottom:12px;
}
.breadcrumb span { color:#333; }
.hero {
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:6px;
  padding:18px 20px;
  margin-bottom:16px;
}
.hero-row {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
}
.title {
  font-size:20px;
  font-weight:600;
  color:#000;
  margin-bottom:8px;
}
.member-line {
  display:flex;
  align-items:center;
  gap:10px;
  color:#666;
  flex-wrap:wrap;
}
.member-chip {
  display:inline-flex;
  align-items:center;
  padding:2px 8px;
  border-radius:3px;
  background:#f5f5f5;
  color:#333;
  font-size:12px;
}
.stat-row {
  display:flex;
  gap:20px;
  align-items:center;
}
.stat-item {
  text-align:center;
  min-width:70px;
}
.stat-num {
  font-size:24px;
  font-weight:600;
  color:#000;
  line-height:1.1;
}
.stat-label {
  color:#999;
  font-size:12px;
  margin-top:4px;
}
.panel {
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:6px;
  padding:16px;
}
.section-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.section-title {
  font-size:15px;
  font-weight:600;
  border-left:3px solid #000;
  padding-left:8px;
}
.filter-bar {
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.filter-bar label { color:#666; font-size:12px; }
.filter-input, .filter-select {
  height:28px;
  border:1px solid #d9d9d9;
  border-radius:4px;
  padding:4px 8px;
  font-size:12px;
  font-family:inherit;
  background:#fff;
}
.filter-input:focus, .filter-select:focus { outline:none; border-color:#000; }
.record-table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
.record-table th {
  background:#FAFAFA;
  padding:9px 8px;
  text-align:left;
  font-weight:500;
  color:#666;
  border-bottom:1px solid #e8e8e8;
  white-space:nowrap;
}
.record-table td {
  padding:10px 8px;
  border-bottom:1px solid #F0F0F0;
  vertical-align:top;
}
.record-table tr:hover { background:#FAFAFA; }
.activity-name {
  font-size:13px;
  font-weight:600;
  color:#000;
  margin-bottom:4px;
}
.activity-note {
  color:#888;
  line-height:1.5;
  max-width:360px;
}
.tag {
  display:inline-block;
  padding:2px 8px;
  border-radius:3px;
  font-size:11px;
  white-space:nowrap;
}
.tag-done { background:#F6FFED; color:#389E0D; border:1px solid #B7EB8F; }
.tag-booked { background:#E6F7FF; color:#1677ff; border:1px solid #91D5FF; }
.tag-cancel { background:#F5F5F5; color:#999; border:1px solid #D9D9D9; }
.pagination {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0 0;
  color:#999;
  font-size:12px;
}
.page-info { display:flex; gap:6px; align-items:center; }
.page-btn {
  padding:4px 10px;
  border:1px solid #d9d9d9;
  border-radius:4px;
  background:#fff;
  cursor:pointer;
  font-size:12px;
  font-family:inherit;
}
.page-btn.active { border-color:#000; color:#000; }
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-logo">松赞<em>用户关系助手</em></div>
  <div class="top-spacer"></div>
  <button class="btn" onclick="goBack()">返回客史信息</button>
</div>

<div class="page-container">
  <div class="breadcrumb">客史信息 / <span>线下活动记录</span></div>

  <section class="hero">
    <div class="hero-row">
      <div>
        <div class="title">线下活动记录</div>
        <div class="member-line">
          <span class="member-chip">王建明</span>
          <span>MD80001234</span>
          <span>金刚</span>
          <span>赵岍维护</span>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-item"><div class="stat-num">6</div><div class="stat-label">活动记录</div></div>
        <div class="stat-item"><div class="stat-num">4</div><div class="stat-label">已参加</div></div>
        <div class="stat-item"><div class="stat-num">1</div><div class="stat-label">待参加</div></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="section-header">
      <div class="section-title">活动明细</div>
      <div class="filter-bar">
        <label>状态</label>
        <select class="filter-select" id="statusFilter" onchange="renderTable()">
          <option value="all">全部</option>
          <option value="done">已参加</option>
          <option value="booked">已报名</option>
          <option value="cancel">已取消</option>
        </select>
        <label>关键词</label>
        <input class="filter-input" id="keywordFilter" placeholder="活动名称/地点" oninput="renderTable()">
      </div>
    </div>

    <table class="record-table">
      <thead>
        <tr>
          <th style="width:28%;">活动名称</th>
          <th>活动时间</th>
          <th>地点</th>
          <th>参与人</th>
          <th>状态</th>
          <th style="width:26%;">跟进备注</th>
        </tr>
      </thead>
      <tbody id="activityTable"></tbody>
    </table>

    <div class="pagination">
      <div id="resultCount">共 0 条</div>
      <div class="page-info">
        <button class="page-btn">上一页</button>
        <button class="page-btn active">1</button>
        <button class="page-btn">下一页</button>
      </div>
    </div>
  </section>
</div>

<script>
var activities = [
  { name:'松赞影像展上海站', time:'2026-05-18 14:00', location:'上海·西岸艺术中心下午场', people:'王建明 / 同行 1 人', status:'booked', statusText:'已报名', note:'客户关注梅里雪山与香格里拉影像内容，活动后适合跟进秋季摄影线路。' },
  { name:'梅里雪山摄影分享会', time:'2025-11-22 19:30', location:'上海·静安会员中心晚场', people:'王建明', status:'done', statusText:'已参加', note:'现场咨询梅里雪山朝圣线路，对摄影领队和小团人数较敏感。' },
  { name:'松赞会员私享茶会', time:'2025-09-07 15:00', location:'杭州·西湖会员中心', people:'王建明 / 同行 2 人', status:'done', statusText:'已参加', note:'偏好安静私密空间，提到下次出行会带父母，需提前确认餐饮口味。' },
  { name:'香格里拉秋季线路说明会', time:'2025-07-26 14:30', location:'上海·静安会员中心', people:'王建明', status:'cancel', statusText:'已取消', note:'临时行程冲突取消，可在后续沟通中补发线路资料。' },
  { name:'松赞林卡亲子手作活动', time:'2024-12-15 10:00', location:'上海·前滩太古里快闪空间', people:'王建明 / 同行 3 人', status:'done', statusText:'已参加', note:'孩子对藏纸手作兴趣高，客户反馈亲子类慢节奏活动更适合家庭出行。' },
  { name:'滇藏线老会员答谢晚宴', time:'2024-10-19 18:30', location:'上海·外滩源会员晚宴', people:'王建明', status:'done', statusText:'已参加', note:'餐饮偏清淡，客户对管家提前沟通评价较高。' }
];

function goBack() {
  if (document.referrer && document.referrer.indexOf('用户关系助手') !== -1) {
    history.back();
  } else {
    window.location.href = '用户关系助手.html';
  }
}

function renderTable() {
  var status = document.getElementById('statusFilter').value;
  var keyword = document.getElementById('keywordFilter').value.trim().toLowerCase();
  var rows = activities.filter(function(item) {
    var hitStatus = status === 'all' || item.status === status;
    var hitKeyword = !keyword || (item.name + item.location + item.note).toLowerCase().indexOf(keyword) >= 0;
    return hitStatus && hitKeyword;
  });
  document.getElementById('activityTable').innerHTML = rows.map(function(item) {
    return '<tr>'
      + '<td><div class="activity-name">'+item.name+'</div></td>'
      + '<td>'+item.time+'</td>'
      + '<td>'+item.location+'</td>'
      + '<td>'+item.people+'</td>'
      + '<td><span class="tag tag-'+item.status+'">'+item.statusText+'</span></td>'
      + '<td><div class="activity-note">'+item.note+'</div></td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="6" style="text-align:center;color:#999;padding:28px;">暂无对应活动记录</td></tr>';
  document.getElementById('resultCount').textContent = '共 ' + rows.length + ' 条';
}

renderTable();
</script>
</body>
</html>
